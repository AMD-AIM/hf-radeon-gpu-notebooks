name: HF One-Click CI
run-name: "[Run] Radeon Global CI"

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Substring filter on model id / notebook name (blank = all)"
        required: false
        default: ""
  push:
    branches: [hf_oneclick_radeon_global]

permissions:
  contents: read

concurrency:
  group: huggingface-oneclick-ci
  cancel-in-progress: false

jobs:
  run-notebooks:
    # The controller keeps the existing long-running self-hosted budget, but
    # uses only an isolated, CPU-only Docker container on this runner. Model
    # code and the workaround image run in the remote Radeon Global Pod.
    runs-on: [self-hosted, rocm, w7900]
    timeout-minutes: 2880
    env:
      HF_ENDPOINT: http://134.199.133.77
      RADEON_CONTROLLER_IMAGE: crpi-ygzb1jbfyj9pjrm6.cn-shenzhen.personal.cr.aliyuncs.com/images_hana/hf-oneclick-radeon-global-controller:latest
      RADEON_CONTROLLER_NAME: hf-ci-radeon-global-controller-${{ github.run_id }}
      RADEON_NOTEBOOK_API: https://radeon-global.anruicloud.com/api/huggingface/notebooks
      RADEON_POD_IMAGE: 10.5.10.12:1808/radeon-cloud-global/huaggingface_for_amd_radeon:20260711_workaround_fix_torch_streaming
      RADEON_POD_STATE: .radeon-pod-ci-state.json

    steps:
      - name: Clear stale run outputs
        run: |
          if [ -z "${GITHUB_WORKSPACE:-}" ]; then
            echo "::error::GITHUB_WORKSPACE is not set"
            exit 1
          fi
          rm -rf -- "$GITHUB_WORKSPACE/results"

      - name: Checkout target revision
        id: checkout
        timeout-minutes: 15
        # This runner is in mainland China. Scope the read-only proxy rewrite
        # to repository checkout only.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://gh-test.anruicloud.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
          sparse-checkout: |
            .github
            doc
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Remove interrupted controller containers
        run: |
          docker ps -aq \
            --filter "label=ai.amd.hf-radeon-global-controller=true" \
            | xargs -r docker rm -f

      - name: Pull prebuilt controller image
        run: |
          if [ -z "${RADEON_CONTROLLER_IMAGE:-}" ]; then
            echo "::error::RADEON_CONTROLLER_IMAGE repository variable is required"
            exit 1
          fi
          if [[ "$RADEON_CONTROLLER_IMAGE" != *:latest ]]; then
            echo "::error::RADEON_CONTROLLER_IMAGE must use the :latest tag"
            exit 1
          fi

          for attempt in 1 2 3; do
            if docker pull "$RADEON_CONTROLLER_IMAGE"; then
              exit 0
            fi
            echo "::warning::controller image pull failed on attempt ${attempt}/3"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run controller unit tests
        run: |
          tools/run_radeon_controller_container.sh tests \
            python -m unittest discover -s tests -v

      - name: Execute notebook CI
        env:
          INPUT_FILTER: ${{ github.event.inputs.filter }}
          HF_TOKEN: ${{ secrets.HF_ONECLICK_TOKEN }}
          RADEON_API_TOKEN: ${{ secrets.RADEON_API_TOKEN }}
          RADEON_USER_NAME: ${{ vars.RADEON_USER_NAME }}
        run: |
          rm -rf results
          mkdir -p results

          FILTER="${INPUT_FILTER:-}"
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_ONECLICK_TOKEN secret is required for this token-enabled branch"
            exit 1
          fi
          if [ -z "${RADEON_API_TOKEN:-}" ]; then
            echo "::error::RADEON_API_TOKEN secret is required"
            exit 1
          fi
          if [ -z "${RADEON_USER_NAME:-}" ]; then
            echo "::error::RADEON_USER_NAME repository variable is required"
            exit 1
          fi

          args=(
            --results-dir results
            --target-file doc/ci_target_models.csv
            --state-file "$RADEON_POD_STATE"
            --fail-on none
          )
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          tools/run_radeon_controller_container.sh execute \
            python -u tools/run_radeon_pod_notebooks.py "${args[@]}"

      - name: Ensure owned Radeon Pod is deleted
        if: always()
        env:
          RADEON_API_TOKEN: ${{ secrets.RADEON_API_TOKEN }}
          RADEON_USER_NAME: ${{ vars.RADEON_USER_NAME }}
        run: |
          cleanup_status=0
          for suffix in tests execute cleanup; do
            docker rm -f \
              "${RADEON_CONTROLLER_NAME}-${suffix}" 2>/dev/null || true
          done

          if [ -f "$RADEON_POD_STATE" ]; then
            if tools/run_radeon_controller_container.sh cleanup \
              python -u tools/run_radeon_pod_notebooks.py \
                --cleanup-state \
                --state-file "$RADEON_POD_STATE"
            then
              :
            else
              cleanup_status=$?
            fi
          fi
          exit "$cleanup_status"

      - name: Publish summary
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          if [ -s results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHECKOUT_OUTCOME" != "success" ]; then
            {
              echo "# Hugging Face One-Click Notebook CI - Results"
              echo
              echo "**Infrastructure failure: repository checkout did not complete.**"
              echo
              echo "Notebook execution did not start, so no current-run summary was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Hugging Face One-Click Notebook CI - Results"
              echo
              echo "**No current-run notebook summary was produced.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-oneclick-results-${{ github.run_id }}
          path: |
            results/*.json
            results/*.ipynb
            results/*.html
            results/*.log
            results/summary.md
            results/progress.md
          retention-days: 30
