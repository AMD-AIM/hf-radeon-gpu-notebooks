name: HF One-Click CI Dispatcher
run-name: "[Dispatch] HF One-Click CI"

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Forwarded substring filter (blank = all)"
        required: false
        default: ""
      use_runner_hf_cache:
        description: "Forwarded cache mode"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-hf-oneclick-local-machine
  cancel-in-progress: false

jobs:
  dispatch-local-machine:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Local Machine CI
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_USE_RUNNER_HF_CACHE: ${{ inputs.use_runner_hf_cache }}
          TARGET_REF: hf_oneclick_local_machine
          TARGET_WORKFLOW: huggingface-oneclick-notebook-ci.yml
        run: |
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_REF" \
            --field filter="$INPUT_FILTER" \
            --field use_runner_hf_cache="$INPUT_USE_RUNNER_HF_CACHE"
