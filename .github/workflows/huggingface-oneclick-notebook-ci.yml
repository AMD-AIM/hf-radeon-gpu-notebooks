name: HF One-Click CI
run-name: "[Run] Radeon Global CI"

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Substring filter on model id / notebook name (blank = all)"
        required: false
        default: ""
  push:
    branches: [hf_oneclick_radeon_global]

permissions:
  contents: write

concurrency:
  group: huggingface-oneclick-ci
  cancel-in-progress: false

jobs:
  run-notebooks:
    # The controller keeps the existing long-running self-hosted budget, but
    # does not use this runner's GPU, Docker, or Hugging Face model cache.
    runs-on: [self-hosted, rocm, w7900]
    timeout-minutes: 2880
    env:
      HF_ENDPOINT: http://134.199.133.77
      RADEON_NOTEBOOK_API: https://radeon-global.anruicloud.com/api/huggingface/notebooks
      RADEON_POD_IMAGE: 10.5.10.12:1808/radeon-cloud-global/huaggingface_for_amd_radeon:20260711_workaround_fix_torch_streaming
      RADEON_POD_STATE: .radeon-pod-ci-state.json

    steps:
      - name: Clear stale run outputs
        run: |
          if [ -z "${GITHUB_WORKSPACE:-}" ]; then
            echo "::error::GITHUB_WORKSPACE is not set"
            exit 1
          fi
          rm -rf -- "$GITHUB_WORKSPACE/results"

      - name: Checkout target revision
        id: checkout
        timeout-minutes: 15
        # This runner is in mainland China. Scope the read-only proxy rewrite
        # to checkout; authenticated pull/push later keep their existing policy.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://gh-test.anruicloud.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          clean: false
          sparse-checkout: |
            .github
            doc
            original_notebooks
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Confirm target commit
        run: |
          git checkout -f "${{ github.sha }}"
          git log --oneline -1

      - name: Install controller dependencies
        run: |
          CONTROLLER_VENV="$RUNNER_TEMP/hf-radeon-pod-controller-${{ github.run_id }}"
          echo "CONTROLLER_VENV=$CONTROLLER_VENV" >> "$GITHUB_ENV"
          python3 -m venv "$CONTROLLER_VENV"
          "$CONTROLLER_VENV/bin/python" -m pip install --disable-pip-version-check \
            -r tools/requirements-radeon-pod-ci.txt

      - name: Run controller unit tests
        run: |
          "$CONTROLLER_VENV/bin/python" -m unittest discover -s tests -v

      - name: Recover owned Pod from an interrupted run
        env:
          RADEON_API_TOKEN: ${{ secrets.RADEON_API_TOKEN }}
          RADEON_USER_NAME: ${{ vars.RADEON_USER_NAME }}
        run: |
          if [ -f "$RADEON_POD_STATE" ]; then
            "$CONTROLLER_VENV/bin/python" -u tools/run_radeon_pod_notebooks.py \
              --cleanup-state \
              --state-file "$RADEON_POD_STATE"
          fi

      - name: Execute notebook CI
        env:
          INPUT_FILTER: ${{ github.event.inputs.filter }}
          HF_TOKEN: ${{ secrets.HF_ONECLICK_TOKEN }}
          RADEON_API_TOKEN: ${{ secrets.RADEON_API_TOKEN }}
          RADEON_USER_NAME: ${{ vars.RADEON_USER_NAME }}
        run: |
          rm -rf results
          mkdir -p results

          FILTER="${INPUT_FILTER:-}"
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_ONECLICK_TOKEN secret is required for this token-enabled branch"
            exit 1
          fi
          if [ -z "${RADEON_API_TOKEN:-}" ]; then
            echo "::error::RADEON_API_TOKEN secret is required"
            exit 1
          fi
          if [ -z "${RADEON_USER_NAME:-}" ]; then
            echo "::error::RADEON_USER_NAME repository variable is required"
            exit 1
          fi

          args=(
            --results-dir results
            --target-file doc/ci_target_models.csv
            --state-file "$RADEON_POD_STATE"
            --fail-on none
          )
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          "$CONTROLLER_VENV/bin/python" -u \
            tools/run_radeon_pod_notebooks.py "${args[@]}"

      - name: Ensure owned Radeon Pod is deleted
        if: always()
        env:
          RADEON_API_TOKEN: ${{ secrets.RADEON_API_TOKEN }}
          RADEON_USER_NAME: ${{ vars.RADEON_USER_NAME }}
        run: |
          if [ -f "$RADEON_POD_STATE" ]; then
            PYTHON="${CONTROLLER_VENV:-}/bin/python"
            if [ -z "${CONTROLLER_VENV:-}" ] || [ ! -x "$PYTHON" ]; then
              PYTHON=python3
            fi
            "$PYTHON" -u tools/run_radeon_pod_notebooks.py \
              --cleanup-state \
              --state-file "$RADEON_POD_STATE"
          fi

      - name: Sync downloaded notebook snapshots
        if: always() && steps.checkout.outcome == 'success' && startsWith(github.ref, 'refs/heads/')
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$BRANCH" ]; then
            echo "No branch ref is available; skip original_notebooks sync."
            exit 0
          fi

          if [ ! -d original_notebooks ]; then
            echo "original_notebooks was not created; nothing to sync."
            exit 0
          fi

          git add original_notebooks
          if git diff --cached --quiet -- original_notebooks; then
            echo "No downloaded notebook snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update original notebooks from Hugging Face [skip ci]"

          retry_git() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "::warning::git command failed on attempt ${attempt}/5: $*"
              sleep $((attempt * 20))
            done
            return 1
          }

          git_via_fetch_proxy() {
            git \
              -c "url.https://gh-test.anruicloud.com/.insteadOf=https://github.com/" \
              "$@"
          }

          if ! retry_git git_via_fetch_proxy pull --rebase origin "$BRANCH"; then
            echo "::warning::Could not rebase downloaded notebook snapshot update; leaving CI result unchanged."
            exit 0
          fi
          if ! retry_git git push origin "HEAD:$BRANCH"; then
            echo "::warning::Could not push downloaded notebook snapshot update; leaving CI result unchanged."
            exit 0
          fi

      - name: Publish summary
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          if [ -s results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHECKOUT_OUTCOME" != "success" ]; then
            {
              echo "# Hugging Face One-Click Notebook CI - Results"
              echo
              echo "**Infrastructure failure: repository checkout did not complete.**"
              echo
              echo "Notebook execution did not start, so no current-run summary was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Hugging Face One-Click Notebook CI - Results"
              echo
              echo "**No current-run notebook summary was produced.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-oneclick-results-${{ github.run_id }}
          path: |
            results/*.json
            results/*.ipynb
            results/*.html
            results/*.log
            results/summary.md
            results/progress.md
          retention-days: 30
